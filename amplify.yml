version: 1
frontend:
  phases:
    build:
      commands: []
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
  customHeaders:
    # CORS — fonts and styles are loaded cross-origin by consuming sites
    - pattern: '**/*'
      headers:
        - key: Access-Control-Allow-Origin
          value: '*'
    # HTML — always revalidate so consumers get the latest showcase
    - pattern: 'index.html'
      headers:
        - key: Cache-Control
          value: no-cache
    # Fonts — large, stable; cache aggressively
    - pattern: 'fonts/**'
      headers:
        - key: Cache-Control
          value: public, max-age=31536000
    # Styles — may update between releases; cache for a day
    - pattern: 'styles/**'
      headers:
        - key: Cache-Control
          value: public, max-age=86400
    # Manifests — short-lived to pick up icon or metadata changes quickly
    - pattern: 'manifest/**'
      headers:
        - key: Cache-Control
          value: public, max-age=3600
    # Media and image placeholders — weekly cache
    - pattern: '*.webp'
      headers:
        - key: Cache-Control
          value: public, max-age=604800
    - pattern: '*.svg'
      headers:
        - key: Cache-Control
          value: public, max-age=604800
    - pattern: '*.mp3'
      headers:
        - key: Cache-Control
          value: public, max-age=604800
    - pattern: '*.mp4'
      headers:
        - key: Cache-Control
          value: public, max-age=604800
    - pattern: '*.webm'
      headers:
        - key: Cache-Control
          value: public, max-age=604800
